<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Kifu-Sensei — AI Go Game Commentary for Your SGF Files</title>
        <meta
            name="description"
            content="Upload an SGF and get move-by-move Go commentary. KataGo finds your costliest mistakes; Claude explains them in words, not just numbers."
        />
        <link rel="canonical" href="https://www.kifu-sensei.ai/" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Kifu-Sensei" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:url" content="https://www.kifu-sensei.ai/" />
        <meta
            property="og:title"
            content="Kifu-Sensei — AI Go Game Commentary for Your SGF Files"
        />
        <meta
            property="og:description"
            content="Upload an SGF and get move-by-move Go commentary. KataGo finds your costliest mistakes; Claude explains them in words, not just numbers."
        />
        <meta
            property="og:image"
            content="https://www.kifu-sensei.ai/og-image.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Kifu-Sensei — KataGo-backed Go game analysis with Claude-generated commentary."
        />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Kifu-Sensei — AI Go Game Commentary for Your SGF Files"
        />
        <meta
            name="twitter:description"
            content="Upload an SGF and get move-by-move Go commentary. KataGo finds your costliest mistakes; Claude explains them in words, not just numbers."
        />
        <meta
            name="twitter:image"
            content="https://www.kifu-sensei.ai/og-image.jpg"
        />
        <meta
            name="twitter:image:alt"
            content="Kifu-Sensei — KataGo-backed Go game analysis with Claude-generated commentary."
        />

        <!-- The design system's type (IBM Plex Serif / Sans / Mono) is fetched
             from Google Fonts by src/styles/ds/tokens/fonts.css. Warming both
             hosts here saves the connection setup that @import would otherwise
             serialise behind the stylesheet request. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Icons / PWA -->
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta
            name="theme-color"
            content="#ffffff"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#121212"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="apple-mobile-web-app-title" content="Kifu-Sensei" />

        <style>
            /* Styling for the pre-hydration fallback in #root only. */
            .boot-fallback {
                max-width: 34rem;
                margin: 12vh auto 0;
                padding: 0 1.5rem;
                text-align: center;
                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: #1a1a1a;
            }
            .boot-fallback h1 {
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1.25;
            }
            .boot-fallback p {
                font-size: 0.95rem;
                line-height: 1.6;
                color: #5f5f5f;
            }
            @media (prefers-color-scheme: dark) {
                .boot-fallback {
                    color: #f0f0f0;
                }
                .boot-fallback p {
                    color: #a8a8a8;
                }
            }
        </style>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "Kifu-Sensei",
                "url": "https://www.kifu-sensei.ai/",
                "description": "Upload an SGF and get move-by-move Go commentary. KataGo finds your costliest mistakes; Claude explains them in words, not just numbers.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Any",
                "browserRequirements": "Requires JavaScript",
                "image": "https://www.kifu-sensei.ai/og-image.jpg",
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                }
            }
        </script>
    </head>
    <body>
        <!--
            Static fallback for crawlers and clients that do not execute JS.
            React replaces the contents of #root on first render, so this is
            only ever visible for the moment before the bundle boots.
        -->
        <div id="root">
            <div class="boot-fallback">
                <img
                    src="/logo.png"
                    alt="Kifu-Sensei logo"
                    width="72"
                    height="72"
                />
                <h1>Understand your mistakes in words, not just numbers</h1>
                <p>
                    Kifu-Sensei turns an SGF file into move-by-move Go
                    commentary: KataGo finds the moves that cost you the most,
                    and Claude explains what went wrong and what to play
                    instead.
                </p>
                <noscript>
                    <p>
                        JavaScript is required to upload a game and generate
                        commentary.
                    </p>
                </noscript>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
