name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

# A new push to the same branch supersedes the run already in flight. `main` is
# excluded so every commit that lands keeps a complete result.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

env:
    NODE_VERSION: "22"

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "latest"
                  enable-cache: true
                  cache-dependency-glob: "backend/uv.lock"

            - name: Install dependencies
              working-directory: ./backend
              run: uv sync --dev --frozen

            - name: Ruff (lint)
              working-directory: ./backend
              run: uv run ruff check .

            - name: Ruff (format check)
              working-directory: ./backend
              run: uv run ruff format --check .

            - name: isort (import sorting check)
              working-directory: ./backend
              run: uv run isort --check-only --diff .

            - name: Tests
              working-directory: ./backend
              # `API_ENDPOINT` has to be set for `app.config` to import at all;
              # nothing in the suite reaches it, every upstream call is mocked.
              env:
                  ENVIRONMENT: test
                  API_ENDPOINT: http://katago.invalid
              run: uv run pytest

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: ESLint
              working-directory: ./frontend
              run: npm run lint

            - name: Prettier (format check)
              working-directory: ./frontend
              run: npm run format:check

            - name: Tests
              working-directory: ./frontend
              run: npm test

            # Runs `tsc -b` first, so this covers type checking as well.
            - name: Build
              working-directory: ./frontend
              run: npm run build

    extension:
        name: Extension
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"
                  cache-dependency-path: extension/package-lock.json

            - name: Install dependencies
              working-directory: ./extension
              run: npm ci

            - name: ESLint
              working-directory: ./extension
              run: npm run lint

            - name: Prettier (format check)
              working-directory: ./extension
              run: npm run format:check

            - name: Tests
              working-directory: ./extension
              run: npm test

            # `npm run build` starts with `tsc`, then builds all four Vite entry
            # points (panel, background, content, inject).
            - name: Build
              working-directory: ./extension
              env:
                  VITE_API_URL: http://localhost:8000
                  VITE_FRONTEND_URL: http://localhost:5173
              run: npm run build

    secret-scan:
        name: Secret Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # gitleaks walks the commit history, so a shallow clone would
                  # only ever check the tip.
                  fetch-depth: 0

            - name: Install gitleaks
              run: |
                  curl -sSfL -o /tmp/gitleaks.tar.gz \
                    "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
                  sudo install /tmp/gitleaks /usr/local/bin/gitleaks
                  gitleaks version
              env:
                  GITLEAKS_VERSION: "8.28.0"

            # Scans every commit, not just the working tree: a key that was
            # committed and later removed is still a key that has to be rotated.
            - name: Scan commit history for secrets
              run: gitleaks git . --no-banner --redact --verbose

    dependency-audit:
        name: Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "latest"
                  enable-cache: true
                  cache-dependency-glob: "backend/uv.lock"

            - name: Install backend dependencies
              working-directory: ./backend
              run: uv sync --dev --frozen

            - name: pip-audit (backend dependencies)
              working-directory: ./backend
              run: uv run pip-audit --ignore-vuln CVE-2026-3219

            - name: bandit (backend static analysis)
              working-directory: ./backend
              run: uv run bandit -c pyproject.toml -r .

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: npm audit (frontend dependencies)
              working-directory: ./frontend
              run: npm audit --audit-level=moderate

            - name: npm audit (extension dependencies)
              working-directory: ./extension
              run: npm audit --audit-level=moderate
