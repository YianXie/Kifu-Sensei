[project]
name = "kifu-sensei-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "sqlmodel>=0.0.38",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pwdlib[bcrypt]>=0.3.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sgfmill>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "isort>=5.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.isort]
profile = "black"
line_length = 100
