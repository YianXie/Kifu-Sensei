[project]
name = "kifu-sensei-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "sqlmodel>=0.0.38",
    "pydantic-settings==2.14.2",
    "pyjwt>=2.13.0",
    "pwdlib[bcrypt]>=0.3.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sgfmill>=1.1.1",
    "cryptography==48.0.1",
    "anthropic>=0.105.2",
    "psycopg2-binary>=2.9.12",
    "sqladmin>=0.27.1",
    "itsdangerous>=2.2.0",
    "alembic>=1.18.4",
    "pip==26.1.2",
    "msgpack==1.2.1",
    "starlette==1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.8",
    "isort>=5.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B106: `_post_analysis`'s `pass_name` (the KataGo analysis pass being logged — "winrate",
# "detailed", "detailed-previous") trips the hardcoded-password heuristic on the "pass"
# substring; it is not a credential.
skips = ["B101", "B105", "B106", "B601"]

[tool.pytest.ini_options]
# `pythonpath` puts the backend root on sys.path so `import app` works no matter
# which directory pytest is invoked from.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # Surface our own deprecations; third-party ones are out of our control and
    # would otherwise make CI fail on an unrelated dependency bump.
    "error::DeprecationWarning:app.*",
]

[tool.isort]
profile = "black"
line_length = 100
